<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f6f0e6;--card:#fffcf7;--ink:#2e1f15;--muted:#7d6b5b;--line:#e2d6c3;--dk:#3a251a;--gold:#c19a56;--goldink:#2a1a0d}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.5}
header{background:var(--dk);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
header a{color:#e0c48a}
main{max-width:900px;margin:0 auto;padding:20px}
.btn,button{background:var(--gold);color:var(--goldink);border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
button.s{background:#fff;border:1px solid var(--line);color:var(--ink);padding:6px 14px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button{background:#fff;border:1px solid var(--line);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--dk);color:#fff;border-color:var(--dk)}
.bar{display:flex;justify-content:space-between;align-items:center}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .t{display:flex;align-items:center;gap:12px;min-width:0}.row .t img{width:72px;height:48px;object-fit:cover;border-radius:6px;flex:none}
.row small{color:var(--muted)}.row .a{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.85rem;font-weight:700}.wide{grid-column:1/-1}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:4px;background:#fff;color:var(--ink)}
textarea{min-height:80px}img.pv{max-width:220px;border-radius:8px;display:block;margin:8px 0}
#status{font-weight:700}#login a{color:#8a6a2f}#login{max-width:340px;margin:60px auto;background:var(--card);padding:24px;border-radius:12px;border:1px solid var(--line)}
@media(max-width:600px){form{grid-template-columns:1fr}}
.phs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.ph1{width:112px;font-size:.78rem}.ph1 img{width:112px;height:84px;object-fit:cover;border-radius:8px;display:block}.ph1 button{padding:2px 9px;margin:4px 4px 0 0}
.hint{color:var(--muted);font-size:.85rem;margin:0}
</style></head><body>
<header><b>Website admin</b><span><span id="status"></span> <a href="/" target="_blank">View website</a> <button class="s" id="out" style="padding:3px 12px">Log out</button></span></header>
<main>
<div id="login" hidden><h2>Admin login</h2><label>Email<input id="em" type="email" autocomplete="username"></label><label style="margin-top:10px">Password<input id="pw" type="password" autocomplete="current-password"></label><p id="lerr" style="color:#c0392b;min-height:1.2em"></p><button id="lbtn">Log in</button><p><a id="forgot" href="#">Forgot password?</a></p></div>
<div id="rec" hidden style="max-width:340px;margin:60px auto;background:var(--card);padding:24px;border-radius:12px;border:1px solid var(--line)"><h2>Set a new password</h2><label>New password (at least 8 characters)<input id="rp1" type="password" autocomplete="new-password"></label><label style="margin-top:10px">Repeat new password<input id="rp2" type="password" autocomplete="new-password"></label><p id="rerr" style="color:#c0392b;min-height:1.2em"></p><button id="rbtn">Save password</button></div>
<div id="app" hidden>
<div class="tabs"><button data-tab="hero">Hero slides</button><button data-tab="listings">Properties</button><button data-tab="events">Events</button><button data-tab="settings">Settings</button></div>
<div id="panel"></div></div>
</main>
<script src="js/config.js"></script>
<script src="js/supabase.min.js"></script>
<script src="js/admin.js"></script>
</body></html>
