<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title><meta name="robots" content="noindex">
<style>
body{margin:0;background:#f5f6f9;color:#0f2747;font-family:system-ui,sans-serif;line-height:1.5}
header{background:#0f2747;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header a{color:#ff9433}
main{max-width:900px;margin:0 auto;padding:20px}
.btn,button{background:#ff9433;color:#1b1100;border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
button.s{background:#fff;border:1px solid #cfd5e2;color:#0f2747;padding:6px 14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{background:#fff;border:1px solid #cfd5e2;color:#0f2747}
.tabs button[aria-selected="true"]{background:#0f2747;color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center}
.row{background:#fff;border:1px solid #e2e5ec;border-radius:10px;padding:10px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row small{color:#5a647c}
form,.box{background:#fff;border:1px solid #e2e5ec;border-radius:12px;padding:18px;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.85rem;font-weight:700}.wide{grid-column:1/-1}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cfd5e2;border-radius:8px;font:inherit;margin-top:4px}
textarea{min-height:80px}img.pv{max-width:180px;border-radius:8px;display:block;margin:8px 0}
#status{font-weight:700}#login{max-width:340px;margin:60px auto;background:#fff;padding:24px;border-radius:12px}
@media(max-width:600px){form{grid-template-columns:1fr}}
.phs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.ph1{width:112px;font-size:.78rem}.ph1 img{width:112px;height:84px;object-fit:cover;border-radius:8px;display:block}.ph1 button{padding:2px 9px;margin:4px 4px 0 0}</style></head><body>
<header><b>Website admin</b><span><span id="status"></span> <a href="/" target="_blank">View website</a> <button class="s" id="out" style="padding:3px 12px">Log out</button></span></header>
<main>
<div id="login" hidden><h2>Admin login</h2><label>Password<input id="pw" type="password" autocomplete="current-password"></label><p id="lerr" style="color:#c0392b"></p><button id="lbtn">Log in</button><p><a id="glink" href="/auth/google" hidden>Forgot password? Sign in with Google</a></p></div>
<div id="app" hidden>
<div class="tabs"><button data-tab="listings">Properties</button><button data-tab="events">Events</button><button data-tab="settings">Settings</button></div>
<div id="panel"></div></div>
</main>
<script src="js/admin.js"></script>
</body></html>
